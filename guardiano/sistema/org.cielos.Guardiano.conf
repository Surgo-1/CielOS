<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Il guardiano di CielOS: solo root possiede il nome; tutti possono chiamarlo (decide polkit, con la password). -->
<busconfig>
  <policy user="root">
    <allow own="org.cielos.Guardiano"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cielos.Guardiano" send_interface="org.cielos.Guardiano1"/>
    <allow send_destination="org.cielos.Guardiano" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
