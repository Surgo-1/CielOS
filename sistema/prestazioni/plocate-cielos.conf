# CielOS: l'indice dei file (plocate: «Cerca in tutto il computer» nel file manager) copre anche la home e i dischi.
# Di serie Arch salta i «bind mount» (con btrfs: /home e gli altri sottovolumi!) e /mnt; le istantanee no, se no
# ogni file comparirebbe una volta per istantanea. Ognuno vede solo i file che può aprire.
[Service]
ExecStart=
ExecStart=/usr/bin/updatedb --prune-bind-mounts no --prunepaths "/afs /media /run /net /tmp /udev /var/cache /var/lib/pacman/local /var/lock /var/run /var/spool /var/tmp /.snapshots /home/.snapshots" --prunenames ".git .hg .svn .snapshots .cache"
