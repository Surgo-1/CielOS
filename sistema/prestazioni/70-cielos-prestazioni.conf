# CielOS: le regolazioni del kernel di CachyOS (cachyos-settings) che aiutano sempre, su ogni PC
# la cache dei file resta più a lungo in memoria (le cartelle si riaprono subito)
vm.vfs_cache_pressure = 50
# scrittura su disco a piccoli passi regolari, non a strappi (niente scatti quando copi file grandi)
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# niente cane da guardia NMI (un interrupt in meno al secondo per core) e niente messaggi del kernel sulla console
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
# la rete: BBR (Google) con la coda fq, più veloce e reattiva sulle linee di casa
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 4096
# tanti file aperti insieme (giochi, Wine/Proton, ricerca nei file)
fs.file-max = 2097152
