# CielOS: swap compressa in RAM (zram, zstd) al posto della partizione di swap: quando la memoria finisce il PC
# rallenta un poco invece di bloccarsi. Fino a metà della RAM, al massimo 8 GB. Per cambiarla:
# /etc/systemd/zram-generator.conf (vince su questo).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
