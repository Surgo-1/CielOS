# CielOS DeepSeek V4.1 Flash Configuration
# Optimized for GTX 1650 4GB VRAM with CPU offload

[model]
# DeepSeek V4.1 Flash variants
name = deepseek-v4.1-flash
size = 7B
format = gguf
base_url = https://huggingface.co/mistralai/DeepSeek-Coder-V4.1-Instruct

# GTX 1650 Specific Quantization
[quantization.gtx-1650]
bits = 2           # Q2_K - 87.5% size reduction
group_size = 64    # Optimal for Turing architecture
vram_budget_mb = 3500
cpu_threads = 10   # Leave 2 cores for system

# Inference Parameters
[inference]
context_length = 2048    # Reduced for VRAM constraints
batch_size = 32          # Small batch for GTX 1650
temp_min_p = 0.1
temperature = 0.7
top_k = 40
top_p = 0.95

# SSD Caching (for layers > VRAM)
[cache.ssd]
enabled = true
path = /tmp/cielos_cache
max_size_gb = 2
pool_path = ~/.cache/cielos/model_layers

# CPU Offload Settings
[offload]
strategy = hybrid         # GPU + CPU hybrid
offload_threshold = 32    # Layers to offload after 32
cpu_ring_buffer = true    # Use ring buffer for CPU inference

# Performance Optimizations
[optimizations]
flash_attention = false  # RTX only
paged_attention = true   # For low VRAM systems
kv_cache_quantized = true
rope_scaling = linear

# DeepSeek V4.1 Flash Distilled Student Model
# Generated by: cieldistill --teacher deepseek-v4.1-flash --student cielos-7b-optimal
[student_model]
name = cielos-deepseek-7b-optimal
architecture = 
  layers: 24
  hidden_dim: 2048
  ff_dim: 8192
  heads: 16
  params_millions: 380
compression = Q2_K
speedup_factor = 2.5x
size_reduction = 72%